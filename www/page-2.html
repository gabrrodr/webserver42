<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="/assets/css/main.css">
		<link rel="stylesheet" href="/assets/css/header.css">
		<link rel="stylesheet" href="/assets/css/navbar.css">
		<title>Post method</title>
	</head>
	<body>
		<div id="header">
			<a href="/">
				<img id="webserv-logo" src="/assets/img/webserv-logo.png" alt="webserv-logo">
			</a>
		</div>
		<div id="container">
			<div id="navbar"></div>
			<script>
				fetch('/navbar.html')
				.then(res => res.text())
				.then(data => { document.getElementById('navbar').innerHTML = data; });

				function sendMessage() {
					const msg = document.getElementById("msgBox").value;

					fetch("/uploads", {
						method: "POST",
						headers: {
							"Content-Type": "text/plain"
						},
						body: msg
					})
					.then(() => {
						document.getElementById("display").innerText = msg;
					});
				}

				const form = document.querySelector('form');
				form.addEventListener('submit', handleSubmit);

				function	handleSubmit(event) {
					const form = event.currentTarget;
					const url = new URL(form.action);
					const formData = new FormData(form);

					fetch(url, {
						method: form.method,
						body: formData,
					});
					event.preventDefault();
				}
			</script>

			</script>
			<div id="content">
				<h1>POST METHOD TEST</h1>
				<textarea id="msgBox" placeholder="Type your message to us!"></textarea>
				<button onclick="sendMessage()">Post</button>
				<div id="display" class="message-output"></div>
			</div>
			<div>
				<h2>Upload files</h2>
				<form action="/data" method="post" enctype="multipart/form-data" >
					<label for="file">File</label>
					<input type="file" name="file" id="file">
					<button type="submit">upload</button>
				</form>
			</div>
		</div>
	</body>
</html>
