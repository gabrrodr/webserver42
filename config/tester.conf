server {
    listen 8080 8069 5000 5050;
    server_name localhost;
    client_max_body_size 1024;
    error_page 404 404.html;

    location / {
        root ./www;
        index index.html;
        methods GET;
    }

    location /put_test {
        root ./www;
        methods PUT;
        upload_store ./uploads;
    }

    location ~ \.bla$ {
        root ./www;
        methods POST;
        cgi_path ./cgi_test;
        cgi_extension .bla;
    }

    location /post_body {
        root ./www;
        methods POST;
        client_max_body_size 100;
    }

    location /directory {
        root ./YoupiBanane;
        index youpi.bad_extension;
        methods GET;
    }
}

