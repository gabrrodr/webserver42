server {
    listen 8080 5000 5050;
    server_name webserv;
    client_max_body_size 1024;
    error_page 404 /error/404.html;
    error_page 401 /error/401.html;
    error_page 403 /error/403.html;

    location / {
        root ./www;
        index index.html;
        methods GET POST DELETE;
        upload_store ./uploads;
    }

    location /assets {
        root ./www;
        autoindex on;
        methods  GET DELETE;
        upload_store ./uploads;
    }

    location /put_test { 
        root ./www;
        methods PUT;
        upload_store ./uploads;
    }
    
    location /cgi-bin {
        root ./www;
        methods GET POST;
        cgi_path /usr/bin/python3 /bin/bash;
        cgi_extension .py .sh .cgi;
        upload_store ./uploads;
    }

    location ~ \.bla$ {
        root ./www;
        methods POST;
    }

    location /post_body {
        root ./www;
        methods POST;
        client_max_body_size 100;
    }

    location /directory {
        root ./YoupiBanane;
        index youpi.bad_extension;
        methods GET;
    }
}

server {
    listen 8069;
    server_name localhost;
    client_max_body_size 1024;
    error_page 404 404.html;

    location / {
        root ./www;
        index index.html;
        methods GET;
    }

    location /put_test {
        root ./www;
        methods PUT;
        upload_store ./uploads;
    }

    location ~ \.bla$ {
        root ./www;
        methods POST;
        cgi_path ./cgi_test;
        cgi_extension .bla;
    }

    location /post_body {
        root ./www;
        methods POST;
        client_max_body_size 100;
    }

    location /directory {
        root ./YoupiBanane;
        index youpi.bad_extension;
        methods GET;
    }
}